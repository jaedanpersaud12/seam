[package]
name = "seam"
version = "0.1.0"
description = "Compare files and folders"
authors = ["Jaedan Persaud"]
license = "MIT"
repository = "https://github.com/jaedanpersaud12/seam"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = ["macos-private-api"] }
similar = "3.2.0"
blake3 = "1.8.7"
encoding_rs = "0.8.42"
ignore = "0.4.33"
rayon = "1.12.0"
notify = "8.2.0"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.3"

[dev-dependencies]
tempfile = "3.27.0"
